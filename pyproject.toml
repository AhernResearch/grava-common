[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grava-common"
version = "0.1.0"
description = "Shared data contracts, geometry and annotation utilities for GRAVA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.4", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
